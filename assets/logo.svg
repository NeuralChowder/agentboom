<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="agentboom logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1126"/>
      <stop offset="1" stop-color="#1c1440"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff5d7d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5d7d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="0.45" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- halo + shockwave arcs -->
  <circle cx="256" cy="256" r="150" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="86" fill="none" stroke="#2dd4bf" stroke-opacity="0.32"
          stroke-width="3" stroke-linecap="round" stroke-dasharray="270 271"
          transform="rotate(35 256 256)"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#8b5cf6" stroke-opacity="0.20"
          stroke-width="3" stroke-linecap="round" stroke-dasharray="210 494"
          transform="rotate(205 256 256)"/>

  <!-- rays: one base bursting into agents -->
  <g stroke-linecap="round" fill="none">
    <line x1="304.9" y1="238.2" x2="421.4" y2="195.8" stroke="#ff5d7d" stroke-width="9"  stroke-opacity="0.85"/>
    <line x1="273.8" y1="207.1" x2="307.3" y2="115.0" stroke="#ffb84d" stroke-width="8"  stroke-opacity="0.85"/>
    <line x1="226.2" y1="213.4" x2="150.5" y2="105.3" stroke="#8b5cf6" stroke-width="10" stroke-opacity="0.9"/>
    <line x1="204.5" y1="263.2" x2="111.4" y2="276.3" stroke="#2dd4bf" stroke-width="7"  stroke-opacity="0.85"/>
    <line x1="222.6" y1="295.8" x2="146.7" y2="386.2" stroke="#ff7d54" stroke-width="8"  stroke-opacity="0.85"/>
    <line x1="278.0" y1="303.1" x2="320.2" y2="393.8" stroke="#5b8cff" stroke-width="8"  stroke-opacity="0.85"/>
    <line x1="303.1" y1="278.0" x2="417.3" y2="331.2" stroke="#ffd166" stroke-width="9"  stroke-opacity="0.85"/>
  </g>

  <!-- agent nodes -->
  <g>
    <circle cx="421.4" cy="195.8" r="16" fill="#ff5d7d"/>
    <circle cx="307.3" cy="115.0" r="12" fill="#ffb84d"/>
    <circle cx="150.5" cy="105.3" r="18" fill="#8b5cf6"/>
    <circle cx="111.4" cy="276.3" r="11" fill="#2dd4bf"/>
    <circle cx="146.7" cy="386.2" r="14" fill="#ff7d54"/>
    <circle cx="320.2" cy="393.8" r="12" fill="#5b8cff"/>
    <circle cx="417.3" cy="331.2" r="15" fill="#ffd166"/>
    <!-- lit cores on a few live agents -->
    <circle cx="150.5" cy="105.3" r="6.5" fill="#f5f0ff" opacity="0.95"/>
    <circle cx="421.4" cy="195.8" r="5.5" fill="#fff0f3" opacity="0.95"/>
    <circle cx="417.3" cy="331.2" r="5"   fill="#fff9ea" opacity="0.95"/>
  </g>

  <!-- sparks -->
  <g>
    <circle cx="333.8" cy="178.2" r="3.5" fill="#ffd166" opacity="0.9"/>
    <circle cx="246.9" cy="152.4" r="3"   fill="#8b5cf6" opacity="0.8"/>
    <circle cx="245.7" cy="373.5" r="3"   fill="#2dd4bf" opacity="0.8"/>
    <circle cx="147.2" cy="306.7" r="2.5" fill="#5b8cff" opacity="0.8"/>
  </g>

  <!-- core -->
  <circle cx="256" cy="256" r="62" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="34" fill="url(#core)"/>
</svg>
