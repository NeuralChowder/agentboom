name: Release

# Two-step pipeline on the repo's self-hosted runner: build both packages,
# then publish them as GitHub Release assets. Install a release with:
#   pip install https://github.com/ejbp/agentboom/releases/download/<tag>/agentboom_sdk-<ver>-py3-none-any.whl

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: [self-hosted, self-hosted-linux, owl-deploy]
    steps:
      - uses: actions/checkout@v4

      - name: Build agentboom + agentboom-sdk (wheel + sdist)
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/ab-rel-venv"
          rm -rf "$VENV" "$RUNNER_TEMP/dist"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q build
          "$VENV/bin/python" -m build . --outdir "$RUNNER_TEMP/dist/"
          "$VENV/bin/python" -m build sdk/ --outdir "$RUNNER_TEMP/dist/"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: [self-hosted, self-hosted-linux, owl-deploy]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release with package assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
