name: CI

# Public repo = build/CI only, on GitHub-hosted runners. Deploys live in
# the PRIVATE ejbp/agentboom-deploy repo, which owns the self-hosted
# runner and the kubeconfig (xema-deploy pattern).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test suite + selfcheck (isolated venv)
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/ab-ci-venv"
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q ./sdk
          "$VENV/bin/python" tests/run_tests.py
          "$VENV/bin/python" bin/agentboom selfcheck

      - name: Packaging sanity (build both wheels)
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/ab-ci-venv"
          "$VENV/bin/pip" install -q build
          "$VENV/bin/python" -m build . --outdir "$RUNNER_TEMP/dist/"
          "$VENV/bin/python" -m build sdk/ --outdir "$RUNNER_TEMP/dist/"
          ls "$RUNNER_TEMP/dist/"
