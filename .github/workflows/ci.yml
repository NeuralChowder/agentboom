name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python tests/run_tests.py -v

      - name: Template selfcheck
        run: python bin/agentboom selfcheck

      - name: Packaging sanity (build both wheels)
        run: |
          pip install build
          python -m build . --outdir dist/
          python -m build sdk/ --outdir dist/
          ls -la dist/
