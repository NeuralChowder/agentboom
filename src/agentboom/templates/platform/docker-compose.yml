# {{AGENT_TITLE}} — deployment stack.
#
#   qwen-agent          Qwen Code daemon (`qwen serve`) — the brain
#   endpoint-platform   FastAPI gateway + mini-apps + scheduler — the body
#   dashboard           Next.js UI (catalog-driven; renders what apps declare)
#
# Ports are published on 127.0.0.1 by default: the dashboard is a thin proxy —
# the gateway's hard public boundary (bearer token on every non-public route)
# is the real protection. Expose externally via a reverse proxy with an
# allowlist, not by widening these bindings.
name: {{AGENT_NAME}}

services:
  qwen-agent:
    build:
      context: .
      args:
        QWEN_VERSION: ${QWEN_VERSION:-latest}
        QWEN_REBUILD: ${QWEN_REBUILD:-0}
        USER_ID: ${USER_ID:-1000}
        USER_NAME: ${USER_NAME:-user}
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
    init: true                    # qwen serve does not reap zombie MCP children
    restart: unless-stopped
    environment:
      - QWEN_SERVER_TOKEN=${QWEN_SERVER_TOKEN}
      - PLATFORM_API=http://endpoint-platform:8000
      - PLATFORM_INTERNAL_URL=http://endpoint-platform:8000
      - PLATFORM_TOKEN=${PLATFORM_TOKEN}
      - QWEN_SERVE_ARGS=${QWEN_SERVE_ARGS:-}
    ports:
      - "127.0.0.1:${PORT_AGENT:-4170}:4170"
    volumes:
      # Container's ~/.qwen lives in the repo (code and config are committed;
      # runtime state inside it is gitignored).
      - ./.qwen-docker:/home/${USER_NAME:-user}/.qwen
      # Platform code is mounted so skills/scripts can use the SDK.
      - ./platform:/home/${USER_NAME:-user}/platform
      # SQLite needs real POSIX locking — a host bind mount causes repeated
      # WAL corruption. Named volume only.
      - agent-data:/home/${USER_NAME:-user}/data
    depends_on:
      - endpoint-platform

  endpoint-platform:
    build:
      context: ./platform
      args:
        USER_ID: ${USER_ID:-1000}
        USER_NAME: ${USER_NAME:-user}
    init: true
    restart: unless-stopped
    # host.docker.internal -> the host, so a local LLM server is reachable
    # from inside the container without extra config (Linux + Docker 20.10+).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATA_DIR=/data
      - AGENT_HOME=/agent-home
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD}
      - PLATFORM_TOKEN=${PLATFORM_TOKEN}
      - PLATFORM_INTERNAL_URL=http://127.0.0.1:8000
      - QWEN_AGENT_URL=http://qwen-agent:4170
      - QWEN_SERVER_TOKEN=${QWEN_SERVER_TOKEN}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - SCHEDULER_TICK_SEC=${SCHEDULER_TICK_SEC:-10}
      - AGENT_MAX_CONCURRENT=${AGENT_MAX_CONCURRENT:-1}
    ports:
      - "127.0.0.1:${PORT_PLATFORM:-8000}:8000"
    volumes:
      # Bind-mounted for hot growth: drop a mini-app folder, it is served
      # within ~2s without rebuild or restart.
      - ./platform:/app
      # The agent home (profile.json + AGENTS.md) so the settings mini-app
      # can read/update the user's global config. Keep this loopback-only.
      - ./.qwen-docker:/agent-home
      - agent-data:/data

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    environment:
      - AGENTBOOM_PLATFORM_URL=http://endpoint-platform:8000
      - NEXT_PUBLIC_PLATFORM_TOKEN=${PLATFORM_TOKEN}
    ports:
      - "127.0.0.1:${PORT_DASHBOARD:-3000}:3000"
    volumes:
      # Bind-mounted for hot growth: edit the frontend, restart the service,
      # it is rebuilt from the current source at container start.
      - ./ui:/app/ui
      - ./dashboard:/app/dashboard
    depends_on:
      - endpoint-platform
    healthcheck:
      # The image ships neither curl nor wget — node is guaranteed present.
      # 127.0.0.1 rather than localhost: next-server binds IPv4 only.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  agent-data:
