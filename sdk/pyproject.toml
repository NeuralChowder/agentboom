[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentboom-sdk"
version = "0.6.0"
description = "Shared runtime SDK for agentboom-based agents: SQLite data layer, qwen-serve agent client, LLM completions, cron, task queue, event bus, and the manifest job scheduler."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eduardo Pinheiro" }]
keywords = ["agents", "sdk", "qwen-code", "scheduler", "miniapps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]

[project.urls]
Homepage = "https://github.com/ejbp/agentboom"

[tool.setuptools.packages.find]
where = ["src"]
